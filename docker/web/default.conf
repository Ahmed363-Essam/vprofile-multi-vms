upstream vproapp {
  server vproapp:8080;
}
server {
  listen 80;
  location / {
    proxy_pass http://vproapp;
  }
}

# Monitoring endpoint for Zabbix ("Nginx by HTTP" template).
# Port 8081 is NOT published in docker-compose.yaml, so it is reachable
# only from containers on the Docker networks (zabbix-server).
server {
  listen 8081;
  location = /basic_status {
    stub_status;
    access_log off;
  }
  location / {
    return 404;
  }
}
