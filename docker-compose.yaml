services:
  vprodb:
    build:
      context: ./docker/db
      dockerfile: Dockerfile

    image: vprocontainers/vprofiledb
    container_name: vprodb
    restart: always
  
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    networks:
      - vprofile-net
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_mysql_root_password
      - MYSQL_DATABASE=accounts
    secrets:
      - db_mysql_root_password
    volumes:
      - vprodbdata:/var/lib/mysql

  vprocache01:
    image: memcached
    restart: always
    read_only: true
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    networks:
      - vprofile-net
    user: memcache
    ports:
      - "11211:11211"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  vpromq01:
    # same RabbitMQ 4.4 + management plugin (HTTP API on 15672, internal only)
    # used by Zabbix "RabbitMQ node by HTTP" template
    image: rabbitmq:4.4-management
    # fixed node name rabbit@vpromq01: without it the node is named after the
    # random container ID, so every recreate starts an empty RabbitMQ database
    # (users, queues lost) and Zabbix can't find the node
    hostname: vpromq01
    restart: always
    read_only: true
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    user: rabbitmq
    networks:
      - vprofile-net
    ports:
      - "5672:5672"

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
    secrets:
      - rabbit_mq_password
    # RabbitMQ has no *_FILE variable, so read the secret file into
    # RABBITMQ_DEFAULT_PASS right before starting the server
    entrypoint:
      - sh
      - -c
      - RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbit_mq_password)" exec docker-entrypoint.sh rabbitmq-server

  vproapp:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
   
    restart: always
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries

    image: vprocontainers/vprofileapp
    container_name: vproapp
    networks:
      - vprofile-net
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    secrets:
      - tomcat_jmx_password       # enables JMX on 12345 for Zabbix (docker/app/setenv.sh)

    depends_on:
      - vprodb
      - vprocache01
      - vpromq01

  vproweb:
    build:
      context: ./docker/web
    image: vprocontainers/vprofileweb
    container_name: vproweb
    restart: always
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - vprofile-net
    depends_on:
      - vproapp
    ports:
      - "80:80"

  # ---------------------------------------------------------------------------
  # Zabbix 7.0 LTS monitoring
  #   zabbix-db           PostgreSQL for Zabbix's own data
  #   zabbix-server       collects metrics, evaluates triggers
  #   zabbix-web          UI -> http://localhost:8082
  #   zabbix-agent2       MySQL + Memcached plugins
  #   zabbix-java-gateway JMX bridge for Tomcat
  # Hosts/templates are registered by ./zabbix/setup-hosts.py
  # ---------------------------------------------------------------------------
  zabbix-db:
    image: postgres:16-alpine
    restart: always
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - zabbix-net
    environment:
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD_FILE=/run/secrets/zabbix_db_password
    secrets:
      - zabbix_db_password
    volumes:
      - zabbixdbdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - zabbix-net                # talks to zabbix-db / zabbix-web
      - vprofile-net              # polls nginx, rabbitmq, agent2, java gateway
    environment:
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD_FILE=/run/secrets/zabbix_db_password
      - ZBX_JAVAGATEWAY_ENABLE=true
      - ZBX_JAVAGATEWAY=zabbix-java-gateway
      - ZBX_STARTJAVAPOLLERS=5
    secrets:
      - zabbix_db_password
    depends_on:
      - zabbix-db
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - zabbix-net
    ports:
      - "8082:8080"               # Zabbix UI
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD_FILE=/run/secrets/zabbix_db_password
      - PHP_TZ=Asia/Amman
    secrets:
      - zabbix_db_password
    depends_on:
      - zabbix-server
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vprofile-net              # reaches vprodb:3306 and vprocache01:11211
    environment:
      - ZBX_HOSTNAME=zabbix-agent2
      - ZBX_SERVER_HOST=zabbix-server
    depends_on:
      - zabbix-server
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  zabbix-java-gateway:
    image: zabbix/zabbix-java-gateway:alpine-7.0-latest
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vprofile-net              # reaches vproapp:12345 (JMX)
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

secrets:
  db_mysql_root_password:
    file: ./secrets/db_mysql_root_password.txt
  rabbit_mq_password:
    file: ./secrets/rabbit_mq_password.txt
  # Zabbix (create with ./zabbix/generate-secrets.sh)
  zabbix_db_password:
    file: ./secrets/zabbix_db_password.txt
  tomcat_jmx_password:
    file: ./secrets/tomcat_jmx_password.txt

volumes:
  vprodbdata: {}
  rabbitmqdata: {}
  zabbixdbdata: {}

networks:
  vprofile-net:
    driver: bridge
  zabbix-net:
    driver: bridge


