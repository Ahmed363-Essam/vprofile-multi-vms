services:
  vprodb:
    build:
      context: ./docker/db
      dockerfile: Dockerfile

    image: vprocontainers/vprofiledb
    container_name: vprodb
    restart: always
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    networks:
      - vprofile-net
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_mysql_root_password
      - MYSQL_DATABASE=accounts
    secrets:
      - db_mysql_root_password
    volumes:
      - vprodbdata:/var/lib/mysql

  vprocache01:
    image: memcached
    restart: always
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    networks:
      - vprofile-net
    user: memcache
    ports:
      - "11211:11211"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  vpromq01:
    image: rabbitmq
    restart: always
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    user: rabbitmq
    networks:
      - vprofile-net
    ports:
      - "5672:5672"

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
    secrets:
      - rabbit_mq_password
    # RabbitMQ has no *_FILE variable, so read the secret file into
    # RABBITMQ_DEFAULT_PASS right before starting the server
    entrypoint:
      - sh
      - -c
      - RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbit_mq_password)" exec docker-entrypoint.sh rabbitmq-server

  vproapp:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    restart: always
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries

    image: vprocontainers/vprofileapp
    container_name: vproapp
    networks:
      - vprofile-net
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

    depends_on:
      - vprodb
      - vprocache01
      - vpromq01

  vproweb:
    build:
      context: ./docker/web
    image: vprocontainers/vprofileweb
    container_name: vproweb
    restart: always
    cap_drop:
      - ALL                       # no Linux capabilities (runs as non-root)
    security_opt:
      - no-new-privileges:true    # block privilege gain via setuid binaries
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - vprofile-net
    depends_on:
      - vproapp
    ports:
      - "80:80"

secrets:
  db_mysql_root_password:
    file: ./secrets/db_mysql_root_password.txt
  rabbit_mq_password:
    file: ./secrets/rabbit_mq_password.txt

volumes:
  vprodbdata: {}
  rabbitmqdata: {}

networks:
  vprofile-net:
    driver: bridge


