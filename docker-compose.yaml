services:
  vprodb:
    build:
      context: ./docker/db
      dockerfile: Dockerfile

    image: vprocontainers/vprofiledb
    container_name: vprodb
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=vprodbpass
      - MYSQL_DATABASE=accounts
    volumes:
      - vprodbdata:/var/lib/mysql

  vprocache01:
    image: memcached
    ports:
      - "11211:11211"


  vpromq01:
    image: rabbitmq
    ports:
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  vproapp:
    build:
      context: ./docker/app
      dockerfile: Dockerfile

    image: vprocontainers/vprofileapp
    container_name: vproapp
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=vprodb
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=vprodbpass
      - CACHE_HOST=vprocache01
      - CACHE_PORT=11211
      - MQ_HOST=vpromq01
      - MQ_PORT=5672

    volumes:
      - vproappdata:/usr/local/tomcat/webapps


  vproweb:
    build: 
      context: ./docker/web
    image: vprocontainers/vprofileweb
    container_name: vproweb
    ports:
      - "80:80"

volumes:
  vprodbdata: {}
  vproappdata: {}